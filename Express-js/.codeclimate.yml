version: 2
exclude_patterns: 
- "migrations"
- "**/node_modules/"
- "*.sql"
- "public/"
- "models"
- "seeders"
- "test"
plugins:
  eslint:
    enabled: true
    channel: "eslint-5"
  duplication:
    enabled: true
  fixme:
    enabled: true
  nodesecurity:
    enabled: true

checks:
  argument-count:
    config:
      threshold: 4
  complex-logic:
    config:
      threshold: 4
  file-lines:
    config:
      threshold: 250
  method-complexity:
    config:
      threshold: 5
  method-count:
    config:
      threshold: 20
  method-lines:
    config:
      threshold: 50
  nested-control-flow:
    config:
      threshold: 4
  return-statements:
    config:
      threshold: 4